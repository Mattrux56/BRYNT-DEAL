<div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" data-close-modal aria-label="Cerrar">&times;</button>

        <div class="modal-body" id="modal-form-view">
            <span class="sub-label">AGENDAR DEMO</span>
            <h3 id="modal-title">Cuéntanos de tu empresa</h3>
            <p class="modal-sub">Respondemos por WhatsApp en menos de 24h hábiles.</p>

            <form id="modal-form">
                <label>
                    Nombre
                    <input type="text" name="nombre" required placeholder="Tu nombre completo">
                </label>
                <label>
                    Empresa
                    <input type="text" name="empresa" required placeholder="Nombre de tu empresa">
                </label>
                <label>
                    WhatsApp
                    <input type="tel" name="telefono" required placeholder="Ej. 3001234567">
                </label>
                <label>
                    Plan de interés
                    <select name="plan" id="modal-plan-select">
                        <option value="No sé todavía">No sé todavía</option>
                        <option value="PYMES">PYMES</option>
                        <option value="PREMIUM">Premium</option>
                    </select>
                </label>
                <button type="submit" class="btn-primary modal-submit">Agendar por WhatsApp</button>
            </form>
        </div>

        <div class="modal-body" id="modal-success-view" hidden>
            <span class="sub-label">LISTO</span>
            <h3>Te esperamos en WhatsApp</h3>
            <p class="modal-sub">Abrimos WhatsApp con tu mensaje ya redactado. Si no se abrió automáticamente, escríbenos directamente.</p>
            <button type="button" class="btn-secondary" data-close-modal>Cerrar</button>
        </div>
    </div>
</div>
